<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Logic Quest</title>

</head>
<body>
    <header>
        <div class="inner">
            <div class="box-status"><span class="status">Sistema Online</span></div>
            <h1 class="titulo">Logic Quest</h1>
            <div class="box-text">
                <p>
                    TESTE SUA LÓGICA.
                    <br>
                    DESVENDE OS PADRÔES.
                    <br>
                    VENÇA OS DESAFIOS.
                </p>
            </div>
            <div class="box-info">
                <div class="stat">
                    <span class="stat-value">01</span>
                    <span class="stat-label">Fase</span>                     
                </div> 
                <div class="stat">
                    <span class="stat-value">
                        ★★☆
                    </span>
                    <span class="stat-label">
                        Dificuldade
                    </span >
                </div>
                <div class="stat"> 
                    <span class="stat-value">
                        Solo
                    </span>
                    <span class="stat-label">
                        Modo
                    </span>                    
                </div>  
            </div>
        </div>    
    </header>
    <main>
        <div class=" box-btn"><button  class="btn"id="btn-start">[ Iniciar ]</button>
            <span class="version"> v 0.0.1 - LOGIC QUEST ENGINE</span>
        </div>
        <!-- recolher nome -->
        <dialog id="dialog-name" >
            <form id="form" class="form">
                <div class="box-input">
                    <input type="text" name="input" class="input" id="input" placeholder="Digite seu nome" required>
                    <button type="submit" class="btn" id="enviar">Enviar</button>
                </div>
        </dialog>


        
        <script src="./js/app.js"></script>
    </main>



    
</body>
</html>
